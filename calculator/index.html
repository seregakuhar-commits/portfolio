<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор ремонта</title>
  <style>
    :root {
      --dark: #1a2332;
      --orange: #f0a500;
      --gray: #f5f7fa;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--gray);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 40px rgba(0,0,0,0.1);
    }

    .card-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .card-header h1 {
      font-size: 1.6rem;
      color: var(--dark);
      margin-bottom: 0.5rem;
    }

    .card-header p { color: #666; font-size: 0.95rem; }

    label {
      display: block;
      font-weight: 600;
      color: var(--dark);
      margin-bottom: 0.4rem;
      font-size: 0.95rem;
    }

    .field { margin-bottom: 1.5rem; }

    input[type="number"], select {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      color: var(--dark);
      background: white;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }

    input[type="number"]:focus, select:focus {
      outline: none;
      border-color: var(--orange);
    }

    .result-box {
      background: var(--dark);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
    }

    .result-label {
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    .result-price {
      color: var(--orange);
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .price-table {
      margin-top: 2rem;
      border-top: 1px solid #e5e7eb;
      padding-top: 1.5rem;
    }

    .price-table h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #999;
      margin-bottom: 0.75rem;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0;
      font-size: 0.9rem;
      color: #555;
    }

    .price-row span:last-child { color: var(--dark); font-weight: 600; }

    footer {
      margin-top: 1.5rem;
      color: #aaa;
      font-size: 0.85rem;
      text-align: center;
    }

    footer a { color: var(--orange); text-decoration: none; }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <h1>Калькулятор ремонта</h1>
      <p>Рассчитайте стоимость онлайн</p>
    </div>

    <div class="field">
      <label for="area">Площадь помещения (м²)</label>
      <input type="number" id="area" placeholder="Например: 50" min="1" max="9999">
    </div>

    <div class="field">
      <label for="type">Вид ремонта</label>
      <select id="type">
        <option value="cosmetic">Косметический — 3 000 ₽/м²</option>
        <option value="capital">Капитальный — 6 000 ₽/м²</option>
        <option value="turnkey">Под ключ — 10 000 ₽/м²</option>
      </select>
    </div>

    <div class="result-box">
      <div class="result-label">Примерная стоимость</div>
      <div class="result-price" id="result">—</div>
    </div>

    <div class="price-table">
      <h3>Прайс-лист</h3>
      <div class="price-row"><span>Косметический</span><span>от 3 000 ₽/м²</span></div>
      <div class="price-row"><span>Капитальный</span><span>от 6 000 ₽/м²</span></div>
      <div class="price-row"><span>Под ключ</span><span>от 10 000 ₽/м²</span></div>
    </div>
  </div>

  <footer>
    Демо-проект · <a href="../index.html">← Портфолио</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
