<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Калькулятор стоимости ремонта онлайн — рассчитайте примерную цену косметического, капитального или ремонта под ключ по площади помещения.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%231a2332%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22%23f0a500%22>К</text></svg>">
  <title>Калькулятор ремонта</title>
  <link rel="canonical" href="https://seregakuhar-commits.github.io/portfolio/calculator/">
  <meta property="og:title" content="Калькулятор ремонта">
  <meta property="og:description" content="Калькулятор стоимости ремонта онлайн — рассчитайте примерную цену косметического, капитального или ремонта под ключ по площади помещения.">
  <meta property="og:image" content="https://seregakuhar-commits.github.io/portfolio/calculator/og-image.png">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --dark: #1a2332;
      --orange: #f0a500;
      --gray: #f5f7fa;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--gray);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 40px rgba(0,0,0,0.1);
    }

    .card-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .card-header h1 {
      font-size: 1.6rem;
      color: var(--dark);
      margin-bottom: 0.5rem;
    }

    .card-header p { color: #666; font-size: 0.95rem; }

    label {
      display: block;
      font-weight: 600;
      color: var(--dark);
      margin-bottom: 0.4rem;
      font-size: 0.95rem;
    }

    .field { margin-bottom: 1.5rem; }

    input[type="number"], select {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      color: var(--dark);
      background: white;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }

    input[type="number"]:focus, select:focus {
      outline: none;
      border-color: var(--orange);
    }

    .result-box {
      background: var(--dark);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
    }

    .result-label {
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    .result-price {
      color: var(--orange);
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .price-table {
      margin-top: 2rem;
      border-top: 1px solid #e5e7eb;
      padding-top: 1.5rem;
    }

    .price-table h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #757575;
      margin-bottom: 0.75rem;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0;
      font-size: 0.9rem;
      color: #555;
    }

    .price-row span:last-child { color: var(--dark); font-weight: 600; }

    footer {
      margin-top: 1.5rem;
      color: #666666;
      font-size: 0.85rem;
      text-align: center;
    }

    footer a { color: #996100; text-decoration: underline; }
    
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="card-header">
      <h1>Калькулятор ремонта</h1>
      <p>Рассчитайте стоимость онлайн</p>
    </div>

    <div class="field">
      <label for="area">Площадь помещения (м²)</label>
      <input type="number" id="area" placeholder="Например: 50" min="1" max="9999">
    </div>

    <div class="field">
      <label for="type">Вид ремонта</label>
      <select id="type">
        <option value="cosmetic">Косметический — 3 000 ₽/м²</option>
        <option value="capital">Капитальный — 6 000 ₽/м²</option>
        <option value="turnkey">Под ключ — 10 000 ₽/м²</option>
      </select>
    </div>

    <div class="result-box">
      <div class="result-label">Примерная стоимость</div>
      <div class="result-price" id="result">—</div>
    </div>

    <div class="price-table">
      <h2>Прайс-лист</h2>
      <div class="price-row"><span>Косметический</span><span>от 3 000 ₽/м²</span></div>
      <div class="price-row"><span>Капитальный</span><span>от 6 000 ₽/м²</span></div>
      <div class="price-row"><span>Под ключ</span><span>от 10 000 ₽/м²</span></div>
    </div>
  </main>

  <footer>
    Демо-проект · <a href="../index.html">← Портфолио</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
