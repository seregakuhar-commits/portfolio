<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Noir — Салон красоты</title>
  <style>
    :root {
      --bg: #1a1a1a;
      --bg-alt: #111111;
      --card: #2a2a2a;
      --gold: #c9a96e;
      --gold-dark: #a8823e;
      --white: #ffffff;
      --gray: #888888;
      --border: #333333;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 1rem;
      line-height: 1.6;
    }

    h1, h2, h3 {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      line-height: 1.2;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      width: 100%;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--gold);
      margin-bottom: 0.75rem;
    }

    /* ─── HERO ─── */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .hero-logo {
      font-family: Georgia, serif;
      font-size: 0.75rem;
      font-weight: 400;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 2.5rem;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 6vw, 5rem);
      color: var(--white);
      margin-bottom: 1rem;
    }

    .hero-sub {
      font-size: 0.9rem;
      color: var(--gray);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 3rem;
    }

    .btn-gold {
      display: inline-block;
      background: var(--gold);
      color: var(--bg);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 0.9rem 2.5rem;
      border-radius: 2px;
      transition: background 0.2s;
    }

    .btn-gold:hover {
      background: var(--gold-dark);
    }
  </style>
</head>
<body>

  <!-- HERO -->
  <section class="hero">
    <p class="hero-logo">Studio Noir</p>
    <h1>Искусство<br>красоты</h1>
    <p class="hero-sub">Профессиональный уход &middot; Москва</p>
    <a class="btn-gold" href="https://t.me/">Записаться</a>
  </section>

  <script>
    // JS будет добавлен в Task 6
  </script>
</body>
</html>
