<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Александра Белова — Frontend-разработчик</title>
  <style>
    :root {
      --bg: #1a1a1a;
      --bg-alt: #111111;
      --card: #2a2a2a;
      --gold: #c9a96e;
      --gold-dark: #a8823e;
      --white: #ffffff;
      --gray: #888888;
      --border: #333333;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      min-height: 100vh;
    }

    h1, h2, h3 {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      line-height: 1.2;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .label {
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--gold);
      margin-bottom: 1rem;
      display: block;
    }

    /* ─── LAYOUT ─── */
    .cv-layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 280px;
      min-width: 280px;
      background: var(--bg-alt);
      padding: 2.5rem 1.75rem;
      border-right: 1px solid var(--border);
    }

    .main {
      flex: 1;
      padding: 3rem 2.5rem;
    }

    @media (max-width: 700px) {
      .cv-layout {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        min-width: unset;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .main {
        padding: 2rem 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="cv-layout">
    <aside class="sidebar">
      <!-- Сайдбар — Tasks 2, 3 -->
    </aside>
    <main class="main">
      <!-- Основной контент — Tasks 4, 5 -->
    </main>
  </div>

  <script>
    // JS — Task 6
  </script>
</body>
</html>
