<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Александра Белова — Frontend-разработчик</title>
  <style>
    :root {
      --bg: #1a1a1a;
      --bg-alt: #111111;
      --card: #2a2a2a;
      --gold: #c9a96e;
      --gold-dark: #a8823e;
      --white: #ffffff;
      --gray: #888888;
      --border: #333333;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      min-height: 100vh;
    }

    h1, h2, h3 {
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 400;
      line-height: 1.2;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .label {
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--gold);
      margin-bottom: 1rem;
      display: block;
    }

    /* ─── САЙДБАР ─── */
    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--gold);
      color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, serif;
      font-size: 1.5rem;
      margin: 0 auto 1.25rem;
    }

    .sidebar-name {
      text-align: center;
      margin-bottom: 0.25rem;
      font-size: 1.3rem;
      color: var(--white);
    }

    .sidebar-title {
      text-align: center;
      font-size: 0.78rem;
      color: var(--gold);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    .sidebar-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin-bottom: 1.75rem;
    }

    .contact-list {
      list-style: none;
      margin-bottom: 2rem;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-size: 0.82rem;
      color: var(--gray);
      margin-bottom: 0.75rem;
    }

    .contact-item svg {
      width: 14px;
      height: 14px;
      fill: var(--gold);
      flex-shrink: 0;
    }

    /* ─── LAYOUT ─── */
    .cv-layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 280px;
      min-width: 280px;
      background: var(--bg-alt);
      padding: 2.5rem 1.75rem;
      border-right: 1px solid var(--border);
    }

    .main {
      flex: 1;
      padding: 3rem 2.5rem;
    }

    @media (max-width: 700px) {
      .cv-layout {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        min-width: unset;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .main {
        padding: 2rem 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="cv-layout">
    <aside class="sidebar">
      <div class="avatar">АБ</div>
      <h1 class="sidebar-name">Александра Белова</h1>
      <p class="sidebar-title">Frontend-разработчик</p>
      <hr class="sidebar-divider">

      <span class="label">Контакты</span>
      <ul class="contact-list">
        <li class="contact-item">

          @a_belova
        </li>
        <li class="contact-item">
          <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>

      </ul>

      <!-- Навыки и языки — Task 3 -->
    </aside>
    <main class="main">

    </main>
  </div>

  <script>

</body>
</html>
