<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC·Card — Цифровые визитки нового поколения</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --gold: #c9a84c;
      --gold-light: #f5d78e;
      --text: #ffffff;
      --text-muted: rgba(255,255,255,0.5);
      --border: rgba(201,168,76,0.2);
      --radius: 12px;
      --topbar-h: 64px;
      --max-w: 1100px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a { text-decoration: none; color: inherit; }

    .container {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 2rem;
    }

    section { padding: 80px 0; }

    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 0.75rem;
    }

    .section-title {
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 1rem;
    }

    /* HEADER */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--topbar-h);
      background: rgba(15,15,26,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .header-logo {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .header-logo span { color: var(--gold); }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 2rem;
      list-style: none;
    }

    .header-nav a {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .header-nav a:hover,
    .header-nav a.active { color: var(--gold); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.4rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s, transform 0.15s;
    }

    .btn:hover { opacity: 0.88; transform: translateY(-1px); }

    .btn-gold { background: var(--gold); color: #0f0f1a; }

    .btn-outline {
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold);
    }

    @media (max-width: 640px) {
      .header-nav { display: none; }
    }

    /* HERO */
    .hero {
      padding: 100px 0 80px;
      min-height: calc(100vh - var(--topbar-h));
      display: flex;
      align-items: center;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(201,168,76,0.1);
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 20px;
      padding: 0.3rem 0.9rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 1.5rem;
    }

    .hero-badge-dot {
      width: 6px;
      height: 6px;
      background: var(--gold);
      border-radius: 50%;
    }

    .hero h1 {
      font-size: clamp(2rem, 4.5vw, 3.2rem);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -1px;
      margin-bottom: 1.25rem;
    }

    .hero h1 em {
      font-style: normal;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-sub {
      font-size: 1.05rem;
      color: var(--text-muted);
      max-width: 420px;
      margin-bottom: 2rem;
      line-height: 1.7;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .hero-note {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 1rem;
    }

    .hero-card-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    @media (max-width: 768px) {
      .hero-grid { grid-template-columns: 1fr; }
      .hero { padding: 60px 0; }
      .hero-card-wrap { order: -1; }
    }
  </style>
</head>
<body>

  <header class="header" id="header">
    <div class="container">
      <div class="header-inner">
        <a class="header-logo" href="#">NFC<span>·</span>Card</a>
        <nav>
          <ul class="header-nav">
            <li><a href="#how">Как работает</a></li>
            <li><a href="#features">Возможности</a></li>
            <li><a href="#pricing">Тарифы</a></li>
          </ul>
        </nav>
        <a class="btn btn-gold" href="#pricing">Заказать</a>
      </div>
    </div>
  </header>

  <section class="hero" id="home">
    <div class="container">
      <div class="hero-grid">
        <div class="hero-text">
          <div class="hero-badge">
            <span class="hero-badge-dot"></span>
            NFC · QR · Digital
          </div>
          <h1>Ваша визитка —<br><em>одно касание</em></h1>
          <p class="hero-sub">NFC-карточка + цифровая визитка. Поделись контактами за секунду — без приложений, без бумаги.</p>
          <div class="hero-actions">
            <a class="btn btn-gold" href="#pricing">Заказать карточку</a>
            <a class="btn btn-outline" href="#how">Как это работает</a>
          </div>
          <p class="hero-note">от 990 ₽ · доставка 3–5 дней</p>
        </div>
        <div class="hero-card-wrap">
          <!-- CARD -->
        </div>
      </div>
    </div>
  </section>

  <script>

</body>
</html>
