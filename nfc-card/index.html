<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC·Card — Цифровые визитки нового поколения</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --gold: #c9a84c;
      --gold-light: #f5d78e;
      --text: #ffffff;
      --text-muted: rgba(255,255,255,0.5);
      --border: rgba(201,168,76,0.2);
      --radius: 12px;
      --topbar-h: 64px;
      --max-w: 1100px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a { text-decoration: none; color: inherit; }

    .container {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 2rem;
    }

    section { padding: 80px 0; }

    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 0.75rem;
    }

    .section-title {
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 1rem;
    }

    /* HEADER */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--topbar-h);
      background: rgba(15,15,26,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .header-logo {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .header-logo span { color: var(--gold); }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 2rem;
      list-style: none;
    }

    .header-nav a {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .header-nav a:hover,
    .header-nav a.active { color: var(--gold); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.4rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s, transform 0.15s;
    }

    .btn:hover { opacity: 0.88; transform: translateY(-1px); }

    .btn-gold { background: var(--gold); color: #0f0f1a; }

    .btn-outline {
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold);
    }

    @media (max-width: 640px) {
      .header-nav { display: none; }
    }
  </style>
</head>
<body>

  <header class="header" id="header">
    <div class="container">
      <div class="header-inner">
        <a class="header-logo" href="#">NFC<span>·</span>Card</a>
        <nav>
          <ul class="header-nav">
            <li><a href="#how">Как работает</a></li>
            <li><a href="#features">Возможности</a></li>
            <li><a href="#pricing">Тарифы</a></li>
          </ul>
        </nav>
        <a class="btn btn-gold" href="#pricing">Заказать</a>
      </div>
    </div>
  </header>

  </script>
</body>
</html>
